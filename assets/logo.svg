<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Logo de Mexa_WEB: monograma M plateada y W azul con una órbita azul">
  <defs>
    <linearGradient id="mwPlata" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d8dee8"/>
      <stop offset="100%" stop-color="#8e99ab"/>
    </linearGradient>
    <linearGradient id="mwAzul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fd4ff"/>
      <stop offset="50%" stop-color="#2b8cff"/>
      <stop offset="100%" stop-color="#123ed6"/>
    </linearGradient>
    <linearGradient id="mwOrbita" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b2fa8"/>
      <stop offset="40%" stop-color="#2b8cff"/>
      <stop offset="100%" stop-color="#8fe0ff"/>
    </linearGradient>
  </defs>

  <!-- Órbita: mitad trasera -->
  <g transform="rotate(-22 110 110)">
    <ellipse cx="110" cy="110" rx="96" ry="55" fill="none" stroke="url(#mwOrbita)" stroke-width="5" opacity="0.5"/>
  </g>

  <!-- Monograma -->
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M44 140 L44 78 L79 114 L114 78 L114 140" stroke="url(#mwPlata)" stroke-width="14"/>
    <!-- separación oscura detrás de la W -->
    <path d="M100 86 L119 148 L136 111 L153 148 L172 86" stroke="#05070d" stroke-width="21"/>
    <path d="M100 86 L119 148 L136 111 L153 148 L172 86" stroke="url(#mwAzul)" stroke-width="14"/>
  </g>

  <!-- Órbita: mitad delantera + satélite -->
  <g transform="rotate(-22 110 110)">
    <path d="M206 110 A96 55 0 0 1 14 110" fill="none" stroke="url(#mwOrbita)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="14" cy="110" r="8" fill="#8fe0ff"/>
  </g>
</svg>
